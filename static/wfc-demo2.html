<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Function Collapse — Interactive Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent: #7c6aff;
    --accent2: #ff6a9b;
    --accent3: #6affb8;
    --text: #e8e8f0;
    --muted: #666680;
    --cell: 18px;
    --radius: 6px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 16px 12px 8px;
    gap: 10px;
    min-height: 520px;
  }

  header {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  header h1 {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  header span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  /* Canvas area */
  #canvas-wrap {
    position: relative;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    flex-shrink: 0;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  /* Overlay during generation */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,15,0.7);
    backdrop-filter: blur(2px);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent3);
    letter-spacing: 0.1em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #overlay.show { opacity: 1; }

  /* Stats bar */
  #stats {
    display: flex;
    gap: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    width: 100%;
    padding: 0 2px;
  }
  #stats .stat { display: flex; gap: 5px; }
  #stats .val { color: var(--text); font-weight: 600; }
  #stats .contradiction { color: var(--accent2); }

  /* Controls */
  #controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* Buttons */
  button {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  button:hover { background: var(--border); border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: #9580ff; border-color: #9580ff; color: #fff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Speed slider */
  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .slider-wrap label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  input[type=range] {
    flex: 1;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* Tileset selector */
  .tileset-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ts-btn {
    font-size: 10px;
    padding: 5px 10px;
    border-radius: 20px;
  }
  .ts-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Progress bar */
  #progress-bar {
    width: 100%;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    width: 0%;
    transition: width 0.1s;
    border-radius: 1px;
  }
</style>
</head>
<body>

<header>
  <h1>Wave Function Collapse</h1>
  <span>Interactive Demo</span>
</header>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="overlay">CONTRADICTION — RESTARTING...</div>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>

<div id="stats">
  <div class="stat">COLLAPSED <span class="val" id="s-collapsed">0</span></div>
  <div class="stat">REMAINING <span class="val" id="s-remain">0</span></div>
  <div class="stat">RESTARTS <span class="val contradiction" id="s-restarts">0</span></div>
  <div class="stat">STEP <span class="val" id="s-step">0</span></div>
</div>

<div id="controls">
  <div class="row">
    <button class="primary" id="btn-run">▶ Run</button>
    <button id="btn-step">Step</button>
    <button id="btn-reset">Reset</button>
    <div class="slider-wrap">
      <label>SPEED</label>
      <input type="range" id="speed" min="1" max="100" value="30">
    </div>
  </div>
  <div class="row tileset-row" id="tileset-row">
    <button class="ts-btn active" data-ts="dungeon">Dungeon</button>
    <button class="ts-btn" data-ts="circuit">Circuit</button>
    <button class="ts-btn" data-ts="terrain">Terrain</button>
    <button class="ts-btn" data-ts="maze">Maze</button>
  </div>
</div>

<script>
// ─── CONFIG ─────────────────────────────────────────────────────────────────
const GRID_W = 22, GRID_H = 18;
const CELL = 18;

// ─── TILESETS ────────────────────────────────────────────────────────────────
// Each tile: { id, color, edges: [N,E,S,W] (socket labels), weight }
// Two tiles can be adjacent if socket label matches

const TILESETS = {
  dungeon: {
    name: 'Dungeon',
    tiles: [
      { id:0, name:'floor',      color:'#1a1a2e', edges:['f','f','f','f'], weight:8 },
      { id:1, name:'wall-h',     color:'#3d2b4f', edges:['w','f','w','f'], weight:3 },
      { id:2, name:'wall-v',     color:'#3d2b4f', edges:['f','w','f','w'], weight:3 },
      { id:3, name:'corner-nw',  color:'#522a66', edges:['w','f','f','w'], weight:1 },
      { id:4, name:'corner-ne',  color:'#522a66', edges:['w','w','f','f'], weight:1 },
      { id:5, name:'corner-se',  color:'#522a66', edges:['f','w','w','f'], weight:1 },
      { id:6, name:'corner-sw',  color:'#522a66', edges:['f','f','w','w'], weight:1 },
      { id:7, name:'pillar',     color:'#7c3f99', edges:['w','w','w','w'], weight:0.5 },
      { id:8, name:'torch',      color:'#ff9933', edges:['f','f','f','f'], weight:0.3 },
      { id:9, name:'door-h',     color:'#8b5e3c', edges:['d','f','d','f'], weight:0.8 },
      { id:10,name:'door-v',     color:'#8b5e3c', edges:['f','d','f','d'], weight:0.8 },
    ],
    // sockets: which labels are compatible N<->S and E<->W
    compat: { 'f':['f','d'], 'w':['w'], 'd':['d','f'] }
  },

  circuit: {
    name: 'Circuit',
    tiles: [
      { id:0, name:'empty',      color:'#0d0d1a', edges:['0','0','0','0'], weight:5 },
      { id:1, name:'trace-h',    color:'#1a3a1a', edges:['0','t','0','t'], weight:4 },
      { id:2, name:'trace-v',    color:'#1a3a1a', edges:['t','0','t','0'], weight:4 },
      { id:3, name:'cross',      color:'#1a5c1a', edges:['t','t','t','t'], weight:1 },
      { id:4, name:'turn-ne',    color:'#1a4a1a', edges:['t','t','0','0'], weight:1.5 },
      { id:5, name:'turn-se',    color:'#1a4a1a', edges:['0','t','t','0'], weight:1.5 },
      { id:6, name:'turn-sw',    color:'#1a4a1a', edges:['0','0','t','t'], weight:1.5 },
      { id:7, name:'turn-nw',    color:'#1a4a1a', edges:['t','0','0','t'], weight:1.5 },
      { id:8, name:'component',  color:'#004466', edges:['t','t','t','t'], weight:0.4 },
      { id:9, name:'via',        color:'#00aaff', edges:['0','0','0','0'], weight:0.3 },
      { id:10,name:'t-north',    color:'#286628', edges:['0','t','t','t'], weight:0.8 },
      { id:11,name:'t-south',    color:'#286628', edges:['t','t','0','t'], weight:0.8 },
    ],
    compat: { 't':['t'], '0':['0'] }
  },

  terrain: {
    name: 'Terrain',
    tiles: [
      { id:0, name:'deep-water', color:'#0a1628', edges:['W','W','W','W'], weight:2 },
      { id:1, name:'water',      color:'#1a3d6e', edges:['W','W','W','W'], weight:3 },
      { id:2, name:'shore',      color:'#4a7fa5', edges:['W','L','L','W'], weight:2 },
      { id:3, name:'shore2',     color:'#4a7fa5', edges:['L','W','W','L'], weight:2 },
      { id:4, name:'sand',       color:'#c8a96e', edges:['L','L','L','L'], weight:3 },
      { id:5, name:'grass',      color:'#3a7a3a', edges:['L','L','L','L'], weight:5 },
      { id:6, name:'forest',     color:'#1a4a1a', edges:['L','L','L','L'], weight:3 },
      { id:7, name:'dense-tree', color:'#0f2d0f', edges:['L','L','L','L'], weight:1 },
      { id:8, name:'hill',       color:'#7a6a5a', edges:['L','L','L','L'], weight:1.5 },
      { id:9, name:'mountain',   color:'#5a5a6a', edges:['M','M','M','M'], weight:0.8 },
      { id:10,name:'snow',       color:'#d0d8e8', edges:['M','M','M','M'], weight:0.5 },
    ],
    compat: { 'W':['W','L'], 'L':['L','W','M'], 'M':['M','L'] }
  },

  maze: {
    name: 'Maze',
    tiles: [
      { id:0, name:'open',       color:'#1a1a22', edges:['O','O','O','O'], weight:3 },
      { id:1, name:'wall-all',   color:'#2a2a3a', edges:['X','X','X','X'], weight:0.3 },
      { id:2, name:'wall-ns',    color:'#252535', edges:['X','O','X','O'], weight:2 },
      { id:3, name:'wall-ew',    color:'#252535', edges:['O','X','O','X'], weight:2 },
      { id:4, name:'wall-n',     color:'#282838', edges:['X','O','O','O'], weight:1 },
      { id:5, name:'wall-e',     color:'#282838', edges:['O','X','O','O'], weight:1 },
      { id:6, name:'wall-s',     color:'#282838', edges:['O','O','X','O'], weight:1 },
      { id:7, name:'wall-w',     color:'#282838', edges:['O','O','O','X'], weight:1 },
      { id:8, name:'corner-ne',  color:'#2d2d3d', edges:['X','X','O','O'], weight:0.8 },
      { id:9, name:'corner-se',  color:'#2d2d3d', edges:['O','X','X','O'], weight:0.8 },
      { id:10,name:'corner-sw',  color:'#2d2d3d', edges:['O','O','X','X'], weight:0.8 },
      { id:11,name:'corner-nw',  color:'#2d2d3d', edges:['X','O','O','X'], weight:0.8 },
    ],
    compat: { 'O':['O'], 'X':['X'] }
  }
};

// Accent colors per tile for detail rendering
const TILE_ACCENTS = {
  dungeon: { 8: '#ff9933', 7: '#9955bb', 9: '#8b5e3c', 10: '#8b5e3c' },
  circuit: { 8: '#0066aa', 9: '#00ccff', 3: '#22aa22' },
  terrain: { 9: '#7a7a8a', 10: '#e8f0f8' },
  maze: {}
};

// ─── WFC ENGINE ─────────────────────────────────────────────────────────────
class WFC {
  constructor(W, H, tileset) {
    this.W = W; this.H = H;
    this.tileset = tileset;
    this.tiles = tileset.tiles;
    this.compat = tileset.compat;
    this.N = this.tiles.length;
    this.reset();
  }

  reset() {
    const full = new Set(this.tiles.map(t => t.id));
    this.cells = Array.from({length: this.H}, () =>
      Array.from({length: this.W}, () => new Set(full))
    );
    this.collapsed = 0;
    this.total = this.W * this.H;
    this.done = false;
    this.contradiction = false;
    this.steps = 0;
  }

  entropy(x, y) {
    return this.cells[y][x].size;
  }

  // Find cell with minimum entropy (> 1)
  pickCell() {
    let minE = Infinity, picks = [];
    for (let y = 0; y < this.H; y++)
      for (let x = 0; x < this.W; x++) {
        const e = this.cells[y][x].size;
        if (e <= 1) continue;
        if (e < minE) { minE = e; picks = [[x,y]]; }
        else if (e === minE) picks.push([x,y]);
      }
    if (!picks.length) return null;
    // Shuffle picks slightly for variety
    return picks[Math.floor(Math.random() * picks.length)];
  }

  collapse(x, y) {
    const opts = [...this.cells[y][x]];
    const weights = opts.map(id => this.tiles[id].weight);
    const total = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    let chosen = opts[opts.length-1];
    for (let i = 0; i < opts.length; i++) {
      r -= weights[i];
      if (r <= 0) { chosen = opts[i]; break; }
    }
    this.cells[y][x] = new Set([chosen]);
    this.collapsed++;
  }

  // Check if two tiles are compatible as neighbors
  // dir: 0=N,1=E,2=S,3=W
  compatible(tileA, tileB, dir) {
    const eA = this.tiles[tileA].edges[dir];
    const eB = this.tiles[tileB].edges[(dir+2)%4]; // opposite edge
    const allowed = this.compat[eA] || [];
    return allowed.includes(eB);
  }

  propagate(startX, startY) {
    const queue = [[startX, startY]];
    const inQueue = new Set([`${startX},${startY}`]);
    const dirs = [[0,-1],[1,0],[0,1],[-1,0]]; // N,E,S,W

    while (queue.length) {
      const [cx, cy] = queue.shift();
      inQueue.delete(`${cx},${cy}`);

      for (let d = 0; d < 4; d++) {
        const nx = cx + dirs[d][0], ny = cy + dirs[d][1];
        if (nx < 0 || ny < 0 || nx >= this.W || ny >= this.H) continue;

        const neighbor = this.cells[ny][nx];
        if (neighbor.size === 0) continue;

        const current = this.cells[cy][cx];
        const toRemove = [];

        for (const nTile of neighbor) {
          // Is nTile compatible with ANY tile in current?
          let ok = false;
          for (const cTile of current) {
            if (this.compatible(cTile, nTile, d)) { ok = true; break; }
          }
          if (!ok) toRemove.push(nTile);
        }

        if (toRemove.length) {
          for (const t of toRemove) neighbor.delete(t);
          if (neighbor.size === 0) { this.contradiction = true; return; }
          if (neighbor.size === 1 && !this.collapsed) this.collapsed++;
          const key = `${nx},${ny}`;
          if (!inQueue.has(key)) { queue.push([nx,ny]); inQueue.add(key); }
        }
      }
    }
  }

  step() {
    if (this.done || this.contradiction) return;
    this.steps++;

    const pos = this.pickCell();
    if (!pos) {
      this.done = true;
      // Count final collapsed
      this.collapsed = this.total;
      return;
    }

    const [x, y] = pos;
    this.collapse(x, y);
    this.propagate(x, y);
  }

  // Count actually collapsed (size=1) cells
  countCollapsed() {
    let c = 0;
    for (let y = 0; y < this.H; y++)
      for (let x = 0; x < this.W; x++)
        if (this.cells[y][x].size === 1) c++;
    return c;
  }
}

// ─── RENDERER ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width  = GRID_W * CELL;
canvas.height = GRID_H * CELL;

// Keep canvas-wrap sized
document.getElementById('canvas-wrap').style.width  = canvas.width + 'px';
document.getElementById('canvas-wrap').style.height = canvas.height + 'px';

function tileColor(ts, tileId, entropy, maxE) {
  const tile = TILESETS[ts].tiles[tileId];
  return tile ? tile.color : '#111';
}

function entropyColor(e, maxE) {
  const t = 1 - (e - 1) / (maxE - 1 + 0.001);
  // dark purple (uncertain) → bright teal (about to collapse)
  const r = Math.round(t * 80 + 10);
  const g = Math.round(t * 60 + 10);
  const b = Math.round(t * 120 + 30);
  return `rgb(${r},${g},${b})`;
}

function drawGrid(wfc, tsKey) {
  const tiles = wfc.tiles;
  const accents = TILE_ACCENTS[tsKey] || {};

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const cell = wfc.cells[y][x];
      const px = x * CELL, py = y * CELL;

      if (cell.size === 0) {
        // Contradiction
        ctx.fillStyle = '#ff0044';
        ctx.fillRect(px, py, CELL, CELL);
      } else if (cell.size === 1) {
        const tId = [...cell][0];
        const col = tiles[tId] ? tiles[tId].color : '#111';
        ctx.fillStyle = col;
        ctx.fillRect(px, py, CELL, CELL);

        // Draw small detail glyph for some tiles
        if (accents[tId]) {
          ctx.fillStyle = accents[tId];
          const s = CELL * 0.35;
          ctx.fillRect(px + (CELL-s)/2, py + (CELL-s)/2, s, s);
        }
      } else {
        // Superposition — entropy visualization
        ctx.fillStyle = entropyColor(cell.size, tiles.length);
        ctx.fillRect(px, py, CELL, CELL);

        // Show count as tiny text
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.font = '7px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(cell.size, px + CELL/2, py + CELL/2);
      }

      // Grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.035)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(px, py, CELL, CELL);
    }
  }
}

// ─── APP STATE ───────────────────────────────────────────────────────────────
let currentTs = 'dungeon';
let wfc = new WFC(GRID_W, GRID_H, TILESETS[currentTs]);
let running = false;
let rafId = null;
let lastTime = 0;
let restarts = 0;
let stepsPerFrame = 1;

const overlay    = document.getElementById('overlay');
const fillBar    = document.getElementById('progress-fill');
const sColl      = document.getElementById('s-collapsed');
const sRemain    = document.getElementById('s-remain');
const sRestarts  = document.getElementById('s-restarts');
const sStep      = document.getElementById('s-step');
const speedSlider= document.getElementById('speed');
const btnRun     = document.getElementById('btn-run');

function updateStats() {
  const c = wfc.countCollapsed();
  sColl.textContent    = c;
  sRemain.textContent  = wfc.total - c;
  sRestarts.textContent= restarts;
  sStep.textContent    = wfc.steps;
  fillBar.style.width  = ((c / wfc.total) * 100).toFixed(1) + '%';
}

function resetAll() {
  wfc = new WFC(GRID_W, GRID_H, TILESETS[currentTs]);
  drawGrid(wfc, currentTs);
  updateStats();
}

async function showContradiction() {
  overlay.classList.add('show');
  await new Promise(r => setTimeout(r, 500));
  overlay.classList.remove('show');
}

function loop(now) {
  if (!running) return;
  const interval = 1000 / (parseFloat(speedSlider.value) * 3 + 5);
  const spf = Math.max(1, Math.floor(parseFloat(speedSlider.value) / 10));

  if (now - lastTime >= interval) {
    lastTime = now;

    for (let i = 0; i < spf; i++) {
      if (wfc.done) {
        running = false;
        btnRun.textContent = '▶ Run';
        drawGrid(wfc, currentTs);
        updateStats();
        return;
      }
      if (wfc.contradiction) {
        restarts++;
        showContradiction();
        wfc = new WFC(GRID_W, GRID_H, TILESETS[currentTs]);
        break;
      }
      wfc.step();
    }

    drawGrid(wfc, currentTs);
    updateStats();
  }

  rafId = requestAnimationFrame(loop);
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────
btnRun.addEventListener('click', () => {
  if (wfc.done) {
    wfc = new WFC(GRID_W, GRID_H, TILESETS[currentTs]);
    restarts = 0;
  }
  running = !running;
  btnRun.textContent = running ? '⏸ Pause' : '▶ Run';
  if (running) { lastTime = 0; rafId = requestAnimationFrame(loop); }
  else cancelAnimationFrame(rafId);
});

document.getElementById('btn-step').addEventListener('click', () => {
  if (running) return;
  if (wfc.done) wfc = new WFC(GRID_W, GRID_H, TILESETS[currentTs]);
  if (wfc.contradiction) { restarts++; wfc = new WFC(GRID_W, GRID_H, TILESETS[currentTs]); }
  wfc.step();
  drawGrid(wfc, currentTs);
  updateStats();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (running) { running = false; btnRun.textContent = '▶ Run'; cancelAnimationFrame(rafId); }
  restarts = 0;
  resetAll();
});

document.getElementById('tileset-row').addEventListener('click', e => {
  const btn = e.target.closest('.ts-btn');
  if (!btn) return;
  document.querySelectorAll('.ts-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTs = btn.dataset.ts;
  if (running) { running = false; btnRun.textContent = '▶ Run'; cancelAnimationFrame(rafId); }
  restarts = 0;
  resetAll();
});

// ─── INIT ────────────────────────────────────────────────────────────────────
resetAll();
</script>
</body>
</html>
