<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Function Collapse</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{--accent:#7c6aff;--accent2:#ff6a9b;--accent3:#3dd68c;--radius:5px}
[data-theme="dark"]{--bg:#0d0d14;--surface:#13131e;--border:#23233a;--text:#ddddf0;--muted:#55556e}
[data-theme="light"]{--bg:#f0f0f8;--surface:#ffffff;--border:#d0d0e8;--text:#1a1a2e;--muted:#8888aa}

html,body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);font-size:11px;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:9px 9px 7px;gap:6px}

#header{width:100%;display:flex;align-items:center;justify-content:space-between}
#header-left{display:flex;align-items:baseline;gap:7px}
#title{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
#subtitle{font-size:9px;color:var(--muted)}

#theme-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);color:var(--muted);padding:3px 8px;cursor:pointer;font-size:10px;font-family:'JetBrains Mono',monospace;transition:border-color .15s,color .15s}
#theme-btn:hover{border-color:var(--accent);color:var(--accent)}

#ts-row{display:flex;gap:5px;width:100%}
.ts-btn{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.05em;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);padding:3px 8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.ts-btn:hover{border-color:var(--accent);color:var(--accent)}
.ts-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

#canvas-wrap{position:relative;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;flex-shrink:0;background:var(--surface)}
canvas{display:block;image-rendering:pixelated}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,20,60,0.12);font-size:9px;letter-spacing:.1em;color:#ff4477;pointer-events:none;opacity:0;transition:opacity .15s}
#overlay.show{opacity:1}

#prog{width:100%;height:2px;background:var(--border);border-radius:1px;overflow:hidden;flex-shrink:0}
#prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent3));width:0%;border-radius:1px;transition:width .08s}

#stats{display:flex;gap:10px;width:100%;color:var(--muted);font-size:9px;flex-shrink:0}
.stat{display:flex;gap:3px}
.val{color:var(--text);font-weight:600}
.val.bad{color:var(--accent2)}

#controls{width:100%;display:flex;gap:5px;align-items:center;flex-shrink:0}
button.ctrl{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);padding:5px 10px;cursor:pointer;transition:all .15s;white-space:nowrap}
button.ctrl:hover{border-color:var(--accent);color:var(--accent)}
button.ctrl.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ctrl.primary:hover{background:#9580ff;border-color:#9580ff}

.speed-wrap{display:flex;align-items:center;gap:5px;flex:1}
.speed-wrap label{font-size:9px;color:var(--muted);white-space:nowrap}
input[type=range]{flex:1;-webkit-appearance:none;height:2px;border-radius:1px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}

#legend{display:flex;gap:7px;flex-wrap:wrap;width:100%;font-size:8px;color:var(--muted);align-items:center;flex-shrink:0}
.leg{display:flex;align-items:center;gap:3px}
.leg-sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
</style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <span id="title">Wave Function Collapse</span>
    <span id="subtitle">Interactive Demo</span>
  </div>
  <button id="theme-btn">☀ Light</button>
</div>

<div id="ts-row">
  <button class="ts-btn active" data-ts="dungeon">⚔ Dungeon</button>
  <button class="ts-btn" data-ts="circuit">⚡ Circuit</button>
  <button class="ts-btn" data-ts="terrain">🌿 Terrain</button>
  <button class="ts-btn" data-ts="pipes">🔧 Pipes</button>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="overlay">CONTRADICTION — RESTARTING</div>
</div>

<div id="prog"><div id="prog-fill"></div></div>

<div id="stats">
  <div class="stat">DONE <span class="val" id="s-done">0</span></div>
  <div class="stat">LEFT <span class="val" id="s-left">0</span></div>
  <div class="stat">⟳ <span class="val bad" id="s-restart">0</span></div>
  <div class="stat">STEP <span class="val" id="s-step">0</span></div>
</div>

<div id="controls">
  <button class="ctrl primary" id="btn-run">▶ Run</button>
  <button class="ctrl" id="btn-step">+1</button>
  <button class="ctrl" id="btn-reset">↺</button>
  <div class="speed-wrap">
    <label>SPD</label>
    <input type="range" id="speed" min="1" max="100" value="35">
  </div>
</div>

<div id="legend"></div>

<script>
// ════════════════════════════════════════════════════
//  GRID CONFIG
// ════════════════════════════════════════════════════
const GW=24, GH=17, CS=17;

// ════════════════════════════════════════════════════
//  DRAW HELPERS
// ════════════════════════════════════════════════════
const r=(ctx,x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
const circ=(ctx,x,y,rad,c)=>{ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()};
const ln=(ctx,x1,y1,x2,y2,c,w=1)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()};

// ════════════════════════════════════════════════════
//  TILESETS
//  Each tile: { edges:[N,E,S,W], w:weight, draw(ctx,px,py,cs,dk) }
//  Sockets: tiles are adjacent only when their touching sockets are compatible
// ════════════════════════════════════════════════════

// ── DUNGEON ───────────────────────────────────────
// Sockets: W=wall, F=floor, D=door
const DUNGEON = {
  label:'Dungeon',
  compat:{ W:['W'], F:['F','D'], D:['D','F'] },
  legend:[
    {c:'#2a1e40',l:'Floor'},{c:'#5a4070',l:'Wall'},{c:'#7a5030',l:'Door'},{c:'#ff9933',l:'Torch'},
  ],
  tiles:[
    // 0 — floor
    {edges:['F','F','F','F'],w:10,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#1e1830':'#ede8f5');
      ctx.fillStyle=dk?'rgba(255,255,255,0.035)':'rgba(0,0,0,0.05)';
      [[2,2],[7,4],[3,9],[10,7],[5,13],[13,11]].forEach(([dx,dy])=>ctx.fillRect(px+dx,py+dy,2,1));
    }},
    // 1 — horizontal wall band (wall N+S, floor E+W)
    {edges:['W','F','W','F'],w:4,draw(ctx,px,py,cs,dk){
      const fl=dk?'#1e1830':'#ede8f5', wl=dk?'#4a3562':'#9080b8';
      r(ctx,px,py,cs,cs,fl);
      r(ctx,px,py,cs,Math.round(cs*0.36),wl);
      r(ctx,px,py+Math.round(cs*0.64),cs,cs-Math.round(cs*0.64),wl);
      // mortar
      ctx.strokeStyle=dk?'rgba(0,0,0,0.35)':'rgba(255,255,255,0.5)';ctx.lineWidth=0.5;
      ctx.strokeRect(px,py+Math.round(cs*0.36),cs,Math.round(cs*0.28));
    }},
    // 2 — vertical wall band (wall E+W, floor N+S)
    {edges:['F','W','F','W'],w:4,draw(ctx,px,py,cs,dk){
      const fl=dk?'#1e1830':'#ede8f5', wl=dk?'#4a3562':'#9080b8';
      r(ctx,px,py,cs,cs,fl);
      r(ctx,px,py,Math.round(cs*0.36),cs,wl);
      r(ctx,px+Math.round(cs*0.64),py,cs-Math.round(cs*0.64),cs,wl);
      ctx.strokeStyle=dk?'rgba(0,0,0,0.35)':'rgba(255,255,255,0.5)';ctx.lineWidth=0.5;
      ctx.strokeRect(px+Math.round(cs*0.36),py,Math.round(cs*0.28),cs);
    }},
    // 3 — solid wall block (all W)
    {edges:['W','W','W','W'],w:3,draw(ctx,px,py,cs,dk){
      const wl=dk?'#4a3562':'#9080b8';
      r(ctx,px,py,cs,cs,wl);
      ctx.strokeStyle=dk?'rgba(0,0,0,0.4)':'rgba(255,255,255,0.35)';ctx.lineWidth=0.5;
      ctx.strokeRect(px,py+cs/2,cs,0);
      ctx.strokeRect(px+cs/2,py,0,cs/2);
      ctx.strokeRect(px+cs*0.25,py+cs/2,0,cs/2);
      ctx.strokeRect(px+cs*0.75,py+cs/2,0,cs/2);
    }},
    // 4 — corner NW (wall N+W, floor S+E)
    {edges:['W','F','F','W'],w:2,draw(ctx,px,py,cs,dk){
      const fl=dk?'#1e1830':'#ede8f5', wl=dk?'#4a3562':'#9080b8';
      r(ctx,px,py,cs,cs,fl);
      r(ctx,px,py,cs,Math.round(cs*0.36),wl);
      r(ctx,px,py,Math.round(cs*0.36),cs,wl);
    }},
    // 5 — corner NE (wall N+E, floor S+W)
    {edges:['W','W','F','F'],w:2,draw(ctx,px,py,cs,dk){
      const fl=dk?'#1e1830':'#ede8f5', wl=dk?'#4a3562':'#9080b8';
      r(ctx,px,py,cs,cs,fl);
      r(ctx,px,py,cs,Math.round(cs*0.36),wl);
      r(ctx,px+Math.round(cs*0.64),py,cs-Math.round(cs*0.64),cs,wl);
    }},
    // 6 — corner SE (wall S+E, floor N+W)
    {edges:['F','W','W','F'],w:2,draw(ctx,px,py,cs,dk){
      const fl=dk?'#1e1830':'#ede8f5', wl=dk?'#4a3562':'#9080b8';
      r(ctx,px,py,cs,cs,fl);
      r(ctx,px,py+Math.round(cs*0.64),cs,cs-Math.round(cs*0.64),wl);
      r(ctx,px+Math.round(cs*0.64),py,cs-Math.round(cs*0.64),cs,wl);
    }},
    // 7 — corner SW (wall S+W, floor N+E)
    {edges:['F','F','W','W'],w:2,draw(ctx,px,py,cs,dk){
      const fl=dk?'#1e1830':'#ede8f5', wl=dk?'#4a3562':'#9080b8';
      r(ctx,px,py,cs,cs,fl);
      r(ctx,px,py+Math.round(cs*0.64),cs,cs-Math.round(cs*0.64),wl);
      r(ctx,px,py,Math.round(cs*0.36),cs,wl);
    }},
    // 8 — door in horizontal wall (D N+S, F E+W)
    {edges:['D','F','D','F'],w:1.2,draw(ctx,px,py,cs,dk){
      const fl=dk?'#1e1830':'#ede8f5', wl=dk?'#4a3562':'#9080b8';
      r(ctx,px,py,cs,cs,fl);
      r(ctx,px,py,cs,Math.round(cs*0.28),wl);
      r(ctx,px,py+Math.round(cs*0.72),cs,cs-Math.round(cs*0.72),wl);
      // door
      r(ctx,px+Math.round(cs*0.18),py+Math.round(cs*0.28),Math.round(cs*0.64),Math.round(cs*0.44),dk?'#7a5030':'#a06840');
      r(ctx,px+Math.round(cs*0.22),py+Math.round(cs*0.3),Math.round(cs*0.56),Math.round(cs*0.38),dk?'#5a3a22':'#8a5830');
      circ(ctx,px+cs*0.68,py+cs*0.5,1.5,dk?'#e0c060':'#b09030');
    }},
    // 9 — torch on floor
    {edges:['F','F','F','F'],w:0.8,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#1e1830':'#ede8f5');
      // stick
      r(ctx,px+Math.round(cs*0.44),py+Math.round(cs*0.48),Math.round(cs*0.12),Math.round(cs*0.34),dk?'#6b4226':'#8b5530');
      // glow
      ctx.beginPath();ctx.arc(px+cs/2,py+cs*0.38,cs*0.22,0,Math.PI*2);
      ctx.fillStyle=dk?'rgba(255,140,0,0.12)':'rgba(255,140,0,0.2)';ctx.fill();
      // flame
      ctx.beginPath();ctx.ellipse(px+cs/2,py+cs*0.38,cs*0.1,cs*0.16,0,0,Math.PI*2);
      ctx.fillStyle='#ff9933';ctx.fill();
      ctx.beginPath();ctx.ellipse(px+cs/2,py+cs*0.36,cs*0.06,cs*0.1,0,0,Math.PI*2);
      ctx.fillStyle='#ffee55';ctx.fill();
    }},
  ]
};

// ── CIRCUIT ───────────────────────────────────────
// Sockets: T=trace, O=empty
const CIRCUIT = {
  label:'Circuit',
  compat:{ T:['T'], O:['O'] },
  legend:[
    {c:'#0d1208',l:'Substrate'},{c:'#22aa44',l:'Trace'},{c:'#0055aa',l:'Chip'},{c:'#00aaff',l:'Via'},
  ],
  tiles:[
    // 0 — empty substrate
    {edges:['O','O','O','O'],w:4,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
    }},
    // 1 — trace horizontal (O N+S, T E+W)
    {edges:['O','T','O','T'],w:5,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      const th=Math.round(cs*0.26), ty=py+Math.round((cs-th)/2);
      r(ctx,px,ty,cs,th,dk?'#196b28':'#289a3a');
      r(ctx,px,ty+1,cs,th-2,dk?'#22aa40':'#33bb4a');
      ln(ctx,px,ty+1,px+cs,ty+1,dk?'rgba(120,255,120,0.2)':'rgba(255,255,255,0.4)',0.5);
    }},
    // 2 — trace vertical (T N+S, O E+W)
    {edges:['T','O','T','O'],w:5,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      const tw=Math.round(cs*0.26), tx=px+Math.round((cs-tw)/2);
      r(ctx,tx,py,tw,cs,dk?'#196b28':'#289a3a');
      r(ctx,tx+1,py,tw-2,cs,dk?'#22aa40':'#33bb4a');
      ln(ctx,tx+1,py,tx+1,py+cs,dk?'rgba(120,255,120,0.2)':'rgba(255,255,255,0.4)',0.5);
    }},
    // 3 — cross (T all)
    {edges:['T','T','T','T'],w:1.5,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      const s=Math.round(cs*0.26), mx=px+Math.round((cs-s)/2), my=py+Math.round((cs-s)/2);
      r(ctx,px,my,cs,s,dk?'#196b28':'#289a3a');
      r(ctx,mx,py,s,cs,dk?'#196b28':'#289a3a');
      r(ctx,px,my+1,cs,s-2,dk?'#22aa40':'#33bb4a');
      r(ctx,mx+1,py,s-2,cs,dk?'#22aa40':'#33bb4a');
    }},
    // 4 — turn NE (T N+E)
    {edges:['T','T','O','O'],w:2,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      const s=Math.round(cs*0.26), mx=px+Math.round((cs-s)/2), my=py+Math.round((cs-s)/2);
      r(ctx,mx,py,s,my-py+s,dk?'#196b28':'#289a3a');
      r(ctx,mx,my,px+cs-mx,s,dk?'#196b28':'#289a3a');
      r(ctx,mx+1,py,s-2,my-py+s,dk?'#22aa40':'#33bb4a');
      r(ctx,mx,my+1,px+cs-mx,s-2,dk?'#22aa40':'#33bb4a');
    }},
    // 5 — turn SE (T S+E)
    {edges:['O','T','T','O'],w:2,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      const s=Math.round(cs*0.26), mx=px+Math.round((cs-s)/2), my=py+Math.round((cs-s)/2);
      r(ctx,mx,my,cs-mx+px,s,dk?'#196b28':'#289a3a');
      r(ctx,mx,my,s,cs-my+py,dk?'#196b28':'#289a3a');
      r(ctx,mx,my+1,cs-mx+px,s-2,dk?'#22aa40':'#33bb4a');
      r(ctx,mx+1,my,s-2,cs-my+py,dk?'#22aa40':'#33bb4a');
    }},
    // 6 — turn SW (T S+W)
    {edges:['O','O','T','T'],w:2,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      const s=Math.round(cs*0.26), mx=px+Math.round((cs-s)/2), my=py+Math.round((cs-s)/2);
      r(ctx,px,my,mx-px+s,s,dk?'#196b28':'#289a3a');
      r(ctx,mx,my,s,cs-my+py,dk?'#196b28':'#289a3a');
      r(ctx,px,my+1,mx-px+s,s-2,dk?'#22aa40':'#33bb4a');
      r(ctx,mx+1,my,s-2,cs-my+py,dk?'#22aa40':'#33bb4a');
    }},
    // 7 — turn NW (T N+W)
    {edges:['T','O','O','T'],w:2,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      const s=Math.round(cs*0.26), mx=px+Math.round((cs-s)/2), my=py+Math.round((cs-s)/2);
      r(ctx,px,my,mx-px+s,s,dk?'#196b28':'#289a3a');
      r(ctx,mx,py,s,my-py+s,dk?'#196b28':'#289a3a');
      r(ctx,px,my+1,mx-px+s,s-2,dk?'#22aa40':'#33bb4a');
      r(ctx,mx+1,py,s-2,my-py+s,dk?'#22aa40':'#33bb4a');
    }},
    // 8 — IC chip (all T, distinct body)
    {edges:['T','T','T','T'],w:0.6,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      const s=Math.round(cs*0.26), mx=px+Math.round((cs-s)/2), my=py+Math.round((cs-s)/2);
      r(ctx,px,my,cs,s,dk?'#196b28':'#289a3a'); r(ctx,mx,py,s,cs,dk?'#196b28':'#289a3a');
      // chip body
      const bx=px+Math.round(cs*0.22), by=py+Math.round(cs*0.22), bs=Math.round(cs*0.56);
      r(ctx,bx,by,bs,bs,dk?'#003a6a':'#1155aa');
      r(ctx,bx+1,by+1,bs-2,bs-2,dk?'#004a88':'#2266cc');
      // pin dots
      ctx.fillStyle=dk?'#88ccff':'#2299ff';
      for(let i=0;i<3;i++){ctx.fillRect(bx+3+i*Math.floor((bs-6)/2),by+2,2,2);ctx.fillRect(bx+3+i*Math.floor((bs-6)/2),by+bs-4,2,2);}
    }},
    // 9 — via pad (O all)
    {edges:['O','O','O','O'],w:0.8,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,dk?'#0d1208':'#dce8d4');
      circ(ctx,px+cs/2,py+cs/2,cs*0.28,dk?'#003355':'#0055aa');
      circ(ctx,px+cs/2,py+cs/2,cs*0.18,dk?'#0077bb':'#0088dd');
      circ(ctx,px+cs/2,py+cs/2,cs*0.08,'#aaddff');
    }},
  ]
};

// ── TERRAIN ───────────────────────────────────────
// Sockets: W=water, S=shore, G=ground, M=mountain
const TERRAIN = {
  label:'Terrain',
  compat:{ W:['W','S'], S:['S','W','G'], G:['G','S','M'], M:['M','G'] },
  legend:[
    {c:'#0a2040',l:'Water'},{c:'#3a7a3a',l:'Grass'},{c:'#c8a96e',l:'Sand'},{c:'#6a6a7a',l:'Mountain'},
  ],
  tiles:[
    // 0 — deep water
    {edges:['W','W','W','W'],w:3,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,'#0a2040');
      ln(ctx,px+2,py+Math.round(cs*0.35),px+cs-2,py+Math.round(cs*0.35),'rgba(40,120,200,0.45)',0.7);
      ln(ctx,px+3,py+Math.round(cs*0.62),px+cs-3,py+Math.round(cs*0.62),'rgba(40,120,200,0.35)',0.7);
    }},
    // 1 — shallow / shore water
    {edges:['S','S','S','S'],w:2,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,'#1a4a7a');
      ln(ctx,px+1,py+Math.round(cs*0.38),px+cs-1,py+Math.round(cs*0.38),'rgba(80,160,220,0.5)',0.7);
      ln(ctx,px+2,py+Math.round(cs*0.65),px+cs-2,py+Math.round(cs*0.65),'rgba(80,160,220,0.4)',0.7);
    }},
    // 2 — sand
    {edges:['G','G','G','G'],w:2,draw(ctx,px,py,cs,dk){
      r(ctx,px,py,cs,cs,'#c8a96e');
      ctx.fillStyle='rgba(160,120,60,0.35)';
      [[2,3],[7,6],[4,10],[11,4],[9,13]].forEach(([dx,dy])=>ctx.fillRect(px+dx,py+dy,2,1));
    }},
    // 3 — grass plain
    {edges:['G','G','G','G'],w:6,draw(ctx,px,py,cs,dk){

    {edges:['P','P','X','X'],w:1.8,draw(ctx,px,py,cs,dk){

      r(ctx,mx,py,s,my-py+s,dk?'#2a4466':'#6688bb');r(ctx,mx,my,px+cs-mx,s,dk?'#2a4466':'#6688bb');

    {edges:['X','P','P','X'],w:1.8,draw(ctx,px,py,cs,dk){

      r(ctx,mx,my,px+cs-mx,s,dk?'#2a4466':'#6688bb');r(ctx,mx,my,s,py+cs-my,dk?'#2a4466':'#6688bb');

    {edges:['X','X','P','P'],w:1.8,draw(ctx,px,py,cs,dk){

      r(ctx,px,y0,cs,h,dk?'#2a4466':'#6688bb');r(ctx,px,y0+1,cs,h-2,dk?'#3a5588':'#7799cc');

      r(ctx,x0,py,w,cs,dk?'#2a4466':'#6688bb');r(ctx,x0+1,py,w-2,cs,dk?'#3a5588':'#7799cc');
      r(ctx,px+Math.round(cs*0.16),py+Math.round(cs*0.28),Math.round(cs*0.68),Math.round(cs*0.44),dk?'#1a5533':'#2a7744');
      r(ctx,px+Math.round(cs*0.2),py+Math.round(cs*0.32),Math.round(cs*0.6),Math.round(cs*0.36),dk?'#226644':'#33aa66');

const TILESETS = { dungeon:DUNGEON, circuit:CIRCUIT, terrain:TERRAIN, pipes:PIPES };

// ════════════════════════════════════════════════════
//  WFC ENGINE
// ════════════════════════════════════════════════════
class WFC {
  constructor(W,H,ts){
    this.W=W;this.H=H;this.ts=ts;
    this.tiles=ts.tiles;this.compat=ts.compat;this.N=ts.tiles.length;
    this.reset();
  }
  reset(){
    const full=new Set(this.tiles.map((_,i)=>i));
    this.cells=Array.from({length:this.H},()=>Array.from({length:this.W},()=>new Set(full)));
    this.done=false;this.contradiction=false;this.steps=0;
  }
  pickCell(){
    let minE=Infinity,picks=[];
    for(let y=0;y<this.H;y++)for(let x=0;x<this.W;x++){
      const e=this.cells[y][x].size;
      if(e<=1)continue;
      if(e<minE){minE=e;picks=[[x,y]];}else if(e===minE)picks.push([x,y]);
    }
    return picks.length?picks[Math.floor(Math.random()*picks.length)]:null;
  }
  collapse(x,y){
    const opts=[...this.cells[y][x]];
    const ws=opts.map(i=>this.tiles[i].w);
    const tot=ws.reduce((a,b)=>a+b,0);
    let rnd=Math.random()*tot,chosen=opts[opts.length-1];
    for(let i=0;i<opts.length;i++){rnd-=ws[i];if(rnd<=0){chosen=opts[i];break;}}
    this.cells[y][x]=new Set([chosen]);
  }
  compatible(a,b,dir){
    const eA=this.tiles[a].edges[dir];
    const eB=this.tiles[b].edges[(dir+2)%4];
    return (this.compat[eA]||[]).includes(eB);
  }
  propagate(sx,sy){
    const q=[[sx,sy]],inq=new Set([`${sx},${sy}`]);
    const D=[[0,-1],[1,0],[0,1],[-1,0]];
    while(q.length){
      const[cx,cy]=q.shift();inq.delete(`${cx},${cy}`);
      for(let d=0;d<4;d++){
        const nx=cx+D[d][0],ny=cy+D[d][1];
        if(nx<0||ny<0||nx>=this.W||ny>=this.H)continue;
        const nb=this.cells[ny][nx];if(nb.size===0)continue;
        const cur=this.cells[cy][cx];
        const rm=[];
        for(const t of nb){let ok=false;for(const c of cur)if(this.compatible(c,t,d)){ok=true;break;}if(!ok)rm.push(t);}
        if(rm.length){
          for(const t of rm)nb.delete(t);
          if(nb.size===0){this.contradiction=true;return;}
          const k=`${nx},${ny}`;if(!inq.has(k)){q.push([nx,ny]);inq.add(k);}
        }
      }
    }
  }
  step(){
    if(this.done||this.contradiction)return;
    this.steps++;
    const pos=this.pickCell();
    if(!pos){this.done=true;return;}
    const[x,y]=pos;
    this.collapse(x,y);this.propagate(x,y);
  }
  countCollapsed(){
    let c=0;
    for(let y=0;y<this.H;y++)for(let x=0;x<this.W;x++)if(this.cells[y][x].size===1)c++;
    return c;
  }
}

// ════════════════════════════════════════════════════
//  RENDERER
// ════════════════════════════════════════════════════
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=GW*CS;canvas.height=GH*CS;
document.getElementById('canvas-wrap').style.cssText=`width:${canvas.width}px;height:${canvas.height}px`;

const isDark=()=>document.documentElement.dataset.theme==='dark';

function entropyBg(e,maxE){
  const dk=isDark(),t=(e-1)/(maxE-1+0.001);
  if(dk){const rr=Math.round(18+t*55),g=Math.round(10+t*18),b=Math.round(38+t*75);return `rgb(${rr},${g},${b})`;}
  else{const rr=Math.round(205+t*25),g=Math.round(200+t*15),b=Math.round(235-t*15);return `rgb(${rr},${g},${b})`;}
}

function drawGrid(wfc){
  const maxE=wfc.N,dk=isDark();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const cell=wfc.cells[y][x];
      const px=x*CS,py=y*CS;
      if(cell.size===0){
        r(ctx,px,py,CS,CS,'#ff1133');
        ctx.fillStyle='#fff';ctx.font=`bold ${CS*0.48}px monospace`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('✕',px+CS/2,py+CS/2+0.5);
      } else if(cell.size===1){
        wfc.ts.tiles[[...cell][0]].draw(ctx,px,py,CS,dk);
      } else {
        r(ctx,px,py,CS,CS,entropyBg(cell.size,maxE));
        ctx.fillStyle=dk?'rgba(255,255,255,0.2)':'rgba(0,0,60,0.22)';
        ctx.font=`${Math.round(CS*0.37)}px monospace`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(cell.size,px+CS/2,py+CS/2+0.5);
      }
      ctx.strokeStyle=dk?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.07)';
      ctx.lineWidth=0.5;ctx.strokeRect(px,py,CS,CS);
    }
  }
}

// ════════════════════════════════════════════════════
//  APP STATE
// ════════════════════════════════════════════════════
let currentTs='dungeon';
let wfc=new WFC(GW,GH,TILESETS[currentTs]);
let running=false,rafId=null,lastTime=0,restarts=0;

const overlay=document.getElementById('overlay');
const progFill=document.getElementById('prog-fill');
const sDone=document.getElementById('s-done');
const sLeft=document.getElementById('s-left');
const sRestart=document.getElementById('s-restart');
const sStep=document.getElementById('s-step');
const speedEl=document.getElementById('speed');
const btnRun=document.getElementById('btn-run');
const legendEl=document.getElementById('legend');

function updateStats(){
  const c=wfc.countCollapsed(),tot=wfc.W*wfc.H;
  sDone.textContent=c;sLeft.textContent=tot-c;
  sRestart.textContent=restarts;sStep.textContent=wfc.steps;
  progFill.style.width=((c/tot)*100).toFixed(1)+'%';
}

function buildLegend(tsKey){
  legendEl.innerHTML='';
  TILESETS[tsKey].legend.forEach(({c,l})=>{
    const d=document.createElement('div');d.className='leg';
    const sw=document.createElement('div');sw.className='leg-sw';sw.style.background=c;
    const sp=document.createElement('span');sp.textContent=l;
    d.appendChild(sw);d.appendChild(sp);legendEl.appendChild(d);
  });
}

function resetAll(){
  wfc=new WFC(GW,GH,TILESETS[currentTs]);
  drawGrid(wfc);updateStats();buildLegend(currentTs);
}

let contraTimer=null;
function flashContradiction(){
  overlay.classList.add('show');
  clearTimeout(contraTimer);
  contraTimer=setTimeout(()=>overlay.classList.remove('show'),380);
}

function loop(now){
  if(!running)return;
  const spd=parseFloat(speedEl.value);
  const interval=Math.max(4,550/Math.pow(spd,1.05));
  const spf=Math.max(1,Math.floor(spd/16));
  if(now-lastTime>=interval){
    lastTime=now;
    for(let i=0;i<spf;i++){
      if(wfc.done){running=false;btnRun.textContent='▶ Run';drawGrid(wfc);updateStats();return;}
      if(wfc.contradiction){restarts++;flashContradiction();wfc=new WFC(GW,GH,TILESETS[currentTs]);break;}
      wfc.step();
    }
    drawGrid(wfc);updateStats();
  }
  rafId=requestAnimationFrame(loop);
}

btnRun.addEventListener('click',()=>{
  if(wfc.done){wfc=new WFC(GW,GH,TILESETS[currentTs]);restarts=0;}
  running=!running;
  btnRun.textContent=running?'⏸ Pause':'▶ Run';
  if(running){lastTime=0;rafId=requestAnimationFrame(loop);}
  else cancelAnimationFrame(rafId);
});

document.getElementById('btn-step').addEventListener('click',()=>{
  if(running)return;
  if(wfc.done)wfc=new WFC(GW,GH,TILESETS[currentTs]);
  if(wfc.contradiction){restarts++;wfc=new WFC(GW,GH,TILESETS[currentTs]);}
  wfc.step();drawGrid(wfc);updateStats();
});

document.getElementById('btn-reset').addEventListener('click',()=>{
  if(running){running=false;btnRun.textContent='▶ Run';cancelAnimationFrame(rafId);}
  restarts=0;resetAll();
});

document.getElementById('ts-row').addEventListener('click',e=>{
  const btn=e.target.closest('.ts-btn');if(!btn)return;
  document.querySelectorAll('.ts-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');currentTs=btn.dataset.ts;
  if(running){running=false;btnRun.textContent='▶ Run';cancelAnimationFrame(rafId);}
  restarts=0;resetAll();
});

document.getElementById('theme-btn').addEventListener('click',()=>{
  const dk=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=dk?'light':'dark';
  document.getElementById('theme-btn').textContent=dk?'🌙 Dark':'☀ Light';
  drawGrid(wfc);
});

resetAll();
</script>
